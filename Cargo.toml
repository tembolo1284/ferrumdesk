[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Paul"]
repository = "https://github.com/tembolo1284/ferrumdesk"

[workspace.dependencies]
# internal
fd-types     = { path = "crates/fd-types" }
fd-market    = { path = "crates/fd-market" }
fd-pricing   = { path = "crates/fd-pricing" }
fd-portfolio = { path = "crates/fd-portfolio" }
fd-engine    = { path = "crates/fd-engine" }
fd-ui        = { path = "crates/fd-ui" }

# pricing kernel — switch to git = "https://github.com/tembolo1284/ferrumquant" when stable
fq-core  = { path = "../ferrumquant/crates/fq-core" }
fq-rates = { path = "../ferrumquant/crates/fq-rates" }

# shared
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon       = "1"
toml        = "0.8"
uuid        = { version = "1", features = ["v4", "serde"] }

# ui
eframe     = "0.29"
egui       = "0.29"
egui_extras = { version = "0.29", features = ["datepicker"] }
egui_plot  = "0.29"

# dev
criterion  = "0.5"
approx     = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2   # keep egui snappy in debug builds
