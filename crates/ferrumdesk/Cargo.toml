[package]
name = "ferrumdesk"
description = "A Rust trader desk: live market data in, ferrumquant pricing and risk out, with a position blotter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ferrumdesk"
path = "src/main.rs"

[features]
default = []
fq = ["fd-engine/fq"]

[dependencies]
fd-types.workspace = true
fd-market.workspace = true
fd-pricing.workspace = true
fd-portfolio.workspace = true
fd-engine.workspace = true
fd-ui.workspace = true
eframe.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
